# hajanek-forge configuration. Paths are relative to forge/ unless absolute.
# Env overrides: LLM_BASE_URL, LLM_API_KEY, LLM_MODEL, FORGE_API_URL, WORKER_TOKEN,
# FORGE_WORKER_NAME, AUDIO_URL, AUDIO_API_KEY, DISCORD_WEBHOOK, HAJANEK_PAGES_DIR.

work_dir: work

llm:
  temperature: 0.7
  max_tokens: 8000
  timeout_s: 600
  attempts: 2            # regenerate with judge feedback when deterministic checks fail
  gold_dir: scripts/gold # relative to content dir
  template: prompts/script_template.md
  judge_checklist: prompts/judge_checklist.md

# Speech model for estimates (judge, catalog est_duration_s) and the speed sent
# to the cloning engine (CONTRACTS §2). Volume is up to the player in the app.
speech:
  gap_s: 0.6             # silence the player leaves between utterances (on top of [pause])
  tones:
    soft:    {speed: 0.85}
    slow:    {speed: 0.78}
    whisper: {speed: 0.75}
  ramp:                  # dojezd: speed falls linearly to speed_to (estimates only)
    section: dojezd
    speed_to: 0.75

judge:
  wpm: 95                # words/min of speech at ref_speed
  ref_speed: 0.85
  length_tolerance: 0.15
  max_sentence_words: 18
  forbidden_words_file: prompts/forbidden_words.txt   # relative to content dir
  llm: auto              # auto (when LLM_BASE_URL set) | on | off
  llm_min_score: 4       # 1–5 scale; content/prompts/judge_checklist.md requires >= 4
  # Section budgets in seconds for a 10-minute script (plan §1.1); scaled linearly for other lengths.
  section_budgets_10min:
    uvod:   [50, 100]
    vstup:  [40, 80]
    pribeh: [270, 450]
    dojezd: [70, 130]

ambient:
  crossfade_s: 4
  lufs: -30
  true_peak: -3
  lra: 11
  bitrate: 96k

publish:
  base_url: https://lioilsources.github.io/hajanek-content/
  default_free: false

nightly:
  queue_file: queue.txt  # lines: "tale length [kind]" or "publish"
  until: "07:00"
  timezone: Europe/Prague

# forge worker on Spark: voice jobs from hajanek-api → AiStack audio service (CONTRACTS §8).
worker:
  audio_url: http://localhost:8093   # AUDIO_URL overrides
  voice_prefix: hajanek-             # voice id in the audio service = prefix + voice UUID
  language: cs
  kinds: [voice_create, voice_delete, render]
  idle_s: 60             # sleep when the queue is empty or a job was deferred (engine down)
  heartbeat_s: 60        # background lease heartbeat (also sent between utterances)
  poll_s: 1              # audio job polling
  tts_timeout_s: 900     # per utterance, including the engine queue
  clip_lufs: -23
  clip_true_peak: -3
  clip_lra: 20           # high so loudnorm stays linear (no dynamic compression)
  clip_bitrate: 64k      # AAC, mono
  clip_sample_rate: 48000
